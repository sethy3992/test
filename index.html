<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030304" />
  <title>The Quiet Clearing</title>
  <link rel="stylesheet" href="./src/style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="world" aria-label="A quiet, dark clearing beneath a red tree"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <main id="gate" class="gate visible">
    <p class="eyebrow">A PLACE BETWEEN THINGS</p>
    <button id="enter" type="button">CLICK TO ENTER</button>
    <p class="hint">W A S D TO WALK <span>·</span> MOUSE TO LOOK <span>·</span> ESC TO LEAVE</p>
    <a id="return" class="return" href="../">RETURN TO THE ANNIVERSARY</a>
  </main>
  <div id="notice" class="notice" aria-live="polite"></div>
  <div id="mobile" class="mobile" hidden>
    <p class="eyebrow">A PLACE BETWEEN THINGS</p>
    <p>This small world is made for a desktop browser.</p>
    <a href="../">RETURN TO THE ANNIVERSARY</a>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
